<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Cadastro</title>
  </head>
  <body>
    <h1 th:text="${livro.id == null} ? 'Cadastrar Livro' : 'Editar Livro'">Cadastrar Livro</h1>

    <nav>
        <a th:href="@{/livros}">
            Livros
        </a>
        <a th:href="@{/autores}">
            Autores
        </a>
        <a th:href="@{/categorias}">
            Categorias
        </a>
    </nav>

    <form th:object="${livro}"
          th:action="${livro.id == null} ? @{/livros} : @{/livros/editar/{id}(id=${livro.id})}"
          method="post">
      <label>Título:</label>

      <input type="text" th:field="*{titulo}" />

      <label for="autorId">Autor:</label>
      <select id="autorId" th:field="*{autorId}" required>
        <option value="">Selecione um autor</option>
        <option th:each="autor : ${autores}"
                th:value="${autor.id}"
                th:text="${autor.nome}"></option>
      </select>

      <label>ISBN:</label>

      <input type="text" th:field="*{isbn}" />

      <label for="categoriaId">Categoria:</label>
      <select id="categoriaId" th:field="*{categoriaId}" required>
        <option value="">Selecione uma categoria</option>
        <option th:each="categoria : ${categorias}"
                th:value="${categoria.id}"
                th:text="${categoria.nome}"></option>
      </select>

      <p th:if="${#lists.isEmpty(autores)}">Cadastre um autor antes de cadastrar um livro.</p>
      <p th:if="${#lists.isEmpty(categorias)}">Cadastre uma categoria antes de cadastrar um livro.</p>
      <p th:if="${erro}" th:text="${erro}"></p>

      <button type="submit" th:text="${livro.id == null} ? 'Cadastrar' : 'Salvar'">Cadastrar</button>
    </form>
  </body>
</html>
