<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Cadastro</title>
  </head>
  <body>
    <h1 th:text="${livro.id == null} ? 'Cadastrar Livro' : 'Editar Livro'">Cadastrar Livro</h1>

    <nav>
        <a th:href="@{/livros}">
            Livros
        </a>
        <a th:href="@{/autores}">
            Autores
        </a>
        <a th:href="@{/categorias}">
            Categorias
        </a>
        <a th:href="@{/usuarios}">
            Usuários
        </a>
        <a th:href="@{/emprestimos}">
            Empréstimos
        </a>
    </nav>

    <form th:object="${livro}"
          th:action="${livro.id == null} ? @{/livros} : @{/livros/editar/{id}(id=${livro.id})}"
          method="post">
      <label>Título:</label>

      <input type="text" th:field="*{titulo}" />

      <label>Autor:</label>

      <input type="text" th:field="*{autor}" />

      <label>ISBN:</label>

      <input type="text" th:field="*{isbn}" />

      <button type="submit" th:text="${livro.id == null} ? 'Cadastrar' : 'Salvar'">Cadastrar</button>
    </form>
  </body>
</html>
