<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Cadastro</title>
  </head>
  <body>
    <h1 th:text="${autor.id == null} ? 'Cadastrar Autor' : 'Editar Autor'">Cadastrar Autor</h1>

    <nav>
        <a th:href="@{/livros}">
            Livros
        </a>
        <a th:href="@{/autores}">
            Autores
        </a>
        <a th:href="@{/categorias}">
            Categorias
        </a>
        <a th:href="@{/usuarios}">
            Usuários
        </a>
        <a th:href="@{/emprestimos}">
            Empréstimos
        </a>
    </nav>

    <form th:object="${autor}"
          th:action="${autor.id == null} ? @{/autores} : @{/autores/editar/{id}(id=${autor.id})}"
          method="post">
      <label>Nome:</label>

      <input type="text" th:field="*{nome}" />

      <label>Nacionalidade:</label>

      <input type="text" th:field="*{nacionalidade}" />

      <label for="livrosPublicados">Livros publicados (selecione vários):</label>
      <select id="livrosPublicados" th:field="*{livrosPublicados}" multiple size="5">
        <option th:each="livro : ${livros}"
                th:value="${livro.id}"
                th:text="${livro.titulo + ' - ' + livro.autor}"></option>
      </select>

      <p th:if="${#lists.isEmpty(livros)}">Cadastre livros antes de associá-los ao autor.</p>
      <button type="submit" th:text="${autor.id == null} ? 'Cadastrar' : 'Salvar'">Cadastrar</button>
    </form>
  </body>
</html>
