<!doctype html>
<html xmlns="...">
  <head>
    <title>Cadastro</title>
  </head>
  <body>
    <h1>Cadastrar Autor</h1>

    <nav>
        <a th:href="@{/livros}">
            Livros
        </a>
        <a th:href="@{/autores}">
            Autores
        </a>
        <a th:href="@{/categorias}">
            Categorias
        </a>
        <a th:href="@{/usuarios}">
            Usuários
        </a>
        <a th:href="@{/emprestimos}">
            Empréstimos
        </a>
    </nav>

    <form th:object="${autor}" action="/autores" method="post">
      <label>Nome:</label>

      <input type="text" th:field="*{nome}" />

      <label>Nacionalidade:</label>

      <input type="text" th:field="*{nacionalidade}" />

      <label>Obras Publicadas:</label>

      <input type="text" th:field="*{obrasPublicadas}" />

      <button type="submit">Cadastrar</button>
    </form>
  </body>
</html>
