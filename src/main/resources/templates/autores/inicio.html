<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Biblioteca</title>
</head>
<body>
    <h1 th:text="'Sistema de Biblioteca'"></h1>
    <nav>
        <a th:href="@{/livros}">
            Livros
        </a>
        <a th:href="@{/autores}">
            Autores
        </a>
        <a th:href="@{/categorias}">
            Categorias
        </a>
        <a th:href="@{/usuarios}">
            Usuários
        </a>
        <a th:href="@{/emprestimos}">
            Empréstimos
        </a>
    </nav>

    <p><a th:href="@{/autores/novo}">Cadastrar Autor</a></p>

    <h2>Autores cadastrados</h2>
    <p th:if="${#lists.isEmpty(autores)}">Nenhum autor cadastrado.</p>
    <table th:unless="${#lists.isEmpty(autores)}" border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Nacionalidade</th>
                <th>Livros publicados</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="autor : ${autores}">
                <td th:text="${autor.nome}"></td>
                <td th:text="${autor.nacionalidade}"></td>
                <td>
                    <span th:if="${#lists.isEmpty(livrosPorAutor[autor.id])}">Nenhum livro associado</span>
                    <ul th:unless="${#lists.isEmpty(livrosPorAutor[autor.id])}">
                        <li th:each="livro : ${livrosPorAutor[autor.id]}" th:text="${livro.titulo}"></li>
                    </ul>
                </td>
                <td>
                    <a th:href="@{/autores/editar/{id}(id=${autor.id})}">Editar</a>
                    <form th:action="@{/autores/excluir/{id}(id=${autor.id})}" method="post">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
